<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <title>6.5 Eventos</title>
  <style>
    #bloque { width: 300px; height: 100px; background-color: #CCCCCC; }
  </style>
  <script>
    // --- Listado 6-157 ---
    function mostrarMensaje() {
      alert("El usuario hizo clic en el elemento");
    }
    function iniciar() {
      var elemento = document.getElementById("bloque");
      elemento.addEventListener("click", mostrarMensaje);
    }
    window.addEventListener("load", iniciar);
